<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder — Catalog</title>
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="color: var(--accent-color);">PC-BUILDER</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="builder.html">Configurator</a></li>
                    <li class="nav-item"><a aria-current="page" class="nav-link active" href="catalog.html">Catalog</a></li>
                    <li class="nav-item"><a class="nav-link" href="prebuilt.html">Pre-built PCs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <div class="container my-5">
            <h1 class="fw-bold" style="color: var(--accent-color);">PC Components Catalog</h1>
            <p>Choose components for your custom PC build.</p>

            <div class="row g-3 my-4">
                <div class="col-md-4">
                    <label for="search-input" class="form-label">Search products</label>
                    <input type="search" id="search-input" class="form-control" placeholder="Search by name...">
                </div>
                <div class="col-md-4">
                    <label for="category-filter" class="form-label">Category</label>
                    <select id="category-filter" class="form-select">
                        <option value="all">All categories</option>
                        <option value="CPU">CPU</option>
                        <option value="GPU">GPU</option>
                        <option value="RAM">RAM</option>
                        <option value="Storage">Storage</option>
                        <option value="Motherboard">Motherboard</option>
                        <option value="Power Supply">Power Supply</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="sort-select" class="form-label">Sort by</label>
                    <select id="sort-select" class="form-select">
                        <option value="default">Default</option>
                        <option value="price-asc">Price: low to high</option>
                        <option value="price-desc">Price: high to low</option>
                    </select>
                </div>
            </div>

            <div class="catalog-grid" id="product-grid"></div>

            <section class="mt-5" id="favorites-section">
                <h2 class="fw-bold" style="color: var(--accent-color);">
                    Favorites <span class="badge bg-primary" id="favorites-count">0</span>
                </h2>
                <ul class="list-group" id="favorites-list">
                    <li class="list-group-item" id="empty-favorites">No favorites yet.</li>
                </ul>
            </section>
        </div>
    </main>

    <footer class="py-4 text-center border-top border-secondary mt-5">
        <p class="mb-0 text-muted">&copy; 2026 PC Builder Team Project. All rights reserved.</p>
    </footer>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="catalog.js"></script>
</body>
</html>
